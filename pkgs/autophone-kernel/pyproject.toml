[project]
name = "autophone-kernel"
version = "0.2.0"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "zhaoawd" }]
requires-python = ">=3.11,<3.14"
description = "Autophone kernel schemas, contracts, and shared primitives"
# Requests allows older releases of these transitive dependencies.
# Keep its TLS and HTTP stack above the versions affected by published advisories.
dependencies = [
    "certifi>=2026.10.18",
    "jsonschema>=4.20",
    "openpyxl>=3.1",
    "pillow>=13.0.0",
    "pyyaml>=6.0",
    "qrcode>=7.4",
    "requests>=2.32",
    "urllib3>=2.8.0",
]

[project.urls]
Homepage = "https://github.com/zhaoawd/autophone"
Repository = "https://github.com/zhaoawd/autophone.git"
Issues = "https://github.com/zhaoawd/autophone/issues"
Changelog = "https://github.com/zhaoawd/autophone/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
bypass-selection = true
only-include = []
exclude = ["**"]

[tool.hatch.build.targets.sdist]
include = ["/pyproject.toml", "/hatch_build.py", "/build_support.py"]
