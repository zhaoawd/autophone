[project]
name = "autophone-console"
version = "0.2.0"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "zhaoawd" }]
requires-python = ">=3.11,<3.14"
description = "Autophone CLI and web device console"
dependencies = ["autophone-kernel==0.2.0", "autophone-rig==0.2.0", "autophone-domain==0.2.0"]

[project.urls]
Homepage = "https://github.com/zhaoawd/autophone"
Repository = "https://github.com/zhaoawd/autophone.git"
Issues = "https://github.com/zhaoawd/autophone/issues"
Changelog = "https://github.com/zhaoawd/autophone/blob/main/CHANGELOG.md"

[project.scripts]
autophone = "autophone.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
bypass-selection = true
only-include = []
exclude = ["**"]

[tool.hatch.build.targets.sdist]
include = ["/pyproject.toml", "/hatch_build.py", "/build_support.py"]
