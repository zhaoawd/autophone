[project]
name = "autophone-rig"
version = "0.2.0"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "zhaoawd" }]
requires-python = ">=3.11,<3.14"
description = "Autophone iOS VM rig agent, UDS transport, and optional PostgreSQL control plane"
dependencies = ["autophone-kernel==0.2.0", "anyio>=4.14.2", "croniter>=6.0", "fastapi>=0.115", "httpx2>=2.12.0", "uvicorn>=0.30", "websockets>=13.0,<14.0"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[project.urls]
Homepage = "https://github.com/zhaoawd/autophone"
Repository = "https://github.com/zhaoawd/autophone.git"
Issues = "https://github.com/zhaoawd/autophone/issues"
Changelog = "https://github.com/zhaoawd/autophone/blob/main/CHANGELOG.md"

[project.scripts]
autophone-control = "autophone.control.http:main"
autophone-rig-agent = "autophone.rig.main:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
bypass-selection = true
only-include = []
exclude = ["**"]

[tool.hatch.build.targets.sdist]
include = ["/pyproject.toml", "/hatch_build.py", "/build_support.py"]
