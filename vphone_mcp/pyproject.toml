[project]
name = "vphone-mcp"
version = "0.2.0"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
authors = [{ name = "zhaoawd" }]
description = "MCP server for programmatic control of vphone-cli iOS VMs"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.3.0",
]

[project.urls]
Homepage = "https://github.com/zhaoawd/autophone/tree/main/vphone_mcp"
Repository = "https://github.com/zhaoawd/autophone.git"
Issues = "https://github.com/zhaoawd/autophone/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
vphone-mcp = "vphone_mcp.server:main"
